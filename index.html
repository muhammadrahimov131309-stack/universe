<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌌 Вселенная</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #0a0a1a; color: #fff;
         min-height: 100vh; padding: 20px; }
  .header { text-align: center; padding: 20px 0; }
  .header h1 { font-size: 28px; background: linear-gradient(90deg, #00d4ff, #aa00ff);
               -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
          border-radius: 16px; padding: 20px; margin: 15px 0; }
  .balance { font-size: 32px; font-weight: bold; color: #00d4ff; }
  .stat { display: flex; justify-content: space-between; margin: 8px 0; color: #aaa; }
  .stat b { color: #fff; }
  h2 { font-size: 18px; margin-bottom: 12px; color: #aa00ff; }
  .item { display: flex; justify-content: space-between; padding: 8px 0;
          border-bottom: 1px solid rgba(255,255,255,0.08); }
  .r1 { color: #aaa; } .r2 { color: #4caf50; } .r3 { color: #aa00ff; } .r4 { color: #ffc107; }
  .btn { width: 100%; padding: 14px; margin: 8px 0; border: none; border-radius: 12px;
         font-size: 16px; font-weight: bold; cursor: pointer; color: #fff; }
  .btn-daily { background: linear-gradient(90deg, #00b894, #00d4ff); }
  .btn-slot { background: linear-gradient(90deg, #aa00ff, #ff0066); }
  .btn:disabled { opacity: 0.5; }
  .msg { text-align: center; color: #00d4ff; min-height: 20px; margin: 10px 0; }
  .rank-item { display: flex; justify-content: space-between; padding: 6px 0; }
  .loading { color: #aaa; text-align: center; }
</style>
</head>
<body>
  <div class="header"><h1>🌌 ВСЕЛЕННАЯ</h1></div>

  <div class="card">
    <div class="stat"><span>Боец:</span><b id="nickname">...</b></div>
    <div class="stat"><span>Баланс:</span></div>
    <div class="balance" id="balance" style="text-align:center">...</div>
    <div class="stat"><span>Уровень:</span><b id="level">...</b></div>
    <div class="stat"><span>Опыт:</span><b id="xp">...</b></div>
    <div class="stat"><span>Место в топе:</span><b id="rank">...</b></div>
  </div>

  <div class="card">
    <h2>🎁 Ежедневки</h2>
    <button class="btn btn-daily" id="dailyBtn" onclick="claimDaily()">Забрать награду дня</button>
    <button class="btn btn-slot" id="slotBtn" onclick="spinSlot()">🎰 Крутить слот</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <h2>🎒 Инвентарь</h2>
    <div id="inventory"><div class="loading">Загрузка...</div></div>
  </div>

  <div class="card">
    <h2>🏆 Топ богачей</h2>
    <div id="top"><div class="loading">Загрузка...</div></div>
  </div>

<script>
const API = "https://others.eu.pythonanywhere.com";
const RARITY = {1:"Обычный", 2:"Редкий", 3:"Эпик", 4:"Легендарный"};

function getUserId() {
  if (window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user)
    return Telegram.WebApp.initDataUnsafe.user.id;
  return 7127705775; // запасной вариант — твой ID, чтобы страница работала и в обычном браузере
}

async function loadProfile() {
  try {
    const r = await fetch(API + "/api/profile?tg_id=" + getUserId());
    const d = await r.json();
    document.getElementById("nickname").textContent = d.nickname;
    document.getElementById("balance").textContent = d.balance.toLocaleString("ru-RU") + " ⭐";
    document.getElementById("level").textContent = d.level;
    document.getElementById("xp").textContent = d.xp;
    document.getElementById("rank").textContent = "#" + d.rank;
  } catch(e) {
    document.getElementById("balance").textContent = "Ошибка связи с сервером";
  }
}

async function loadInventory() {
  try {
    const r = await fetch(API + "/api/inventory?tg_id=" + getUserId());
    const d = await r.json();
    const box = document.getElementById("inventory");
    if (!d.length) { box.innerHTML = '<div class="loading">Пока пусто — ловите артефакты в боте!</div>'; return; }
    box.innerHTML = d.map(i =>
      `<div class="item"><span>${i.name}</span><span class="r${i.rarity}">${RARITY[i.rarity]} · ${i.price}⭐</span></div>`
    ).join("");
  } catch(e) {
    document.getElementById("inventory").innerHTML = '<div class="loading">Ошибка загрузки</div>';
  }
}

async function loadTop() {
  try {
    const r = await fetch(API + "/api/top");
    const d = await r.json();
    document.getElementById("top").innerHTML = d.map((p, i) =>
      `<div class="rank-item"><span>${i+1}. ${p.nickname}</span><b>${p.balance.toLocaleString("ru-RU")} ⭐</b></div>`
    ).join("");
  } catch(e) {
    document.getElementById("top").innerHTML = '<div class="loading">Ошибка загрузки</div>';
  }
}

function showMsg(text) {
  const m = document.getElementById("msg");
  m.textContent = text;
  setTimeout(() => m.textContent = "", 4000);
}

async function claimDaily() {
  const btn = document.getElementById("dailyBtn");
  btn.disabled = true;
  try {
    const r = await fetch(API + "/api/daily", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({tg_id: getUserId()})
    });
    const d = await r.json();
    if (d.ok) showMsg("Получено " + d.amount + " ⭐ (серия: " + d.streak + " дней)");
    else showMsg(d.msg);
  } catch(e) { showMsg("Ошибка, попробуй ещё раз"); }
  btn.disabled = false;
  loadProfile(); loadTop();
}

async function spinSlot() {
  const btn = document.getElementById("slotBtn");
  btn.disabled = true;
  showMsg("Барабаны крутятся...");
  try {
    const r = await fetch(API + "/api/slot", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({tg_id: getUserId()})
    });
    const d = await r.json();
    if (d.ok) showMsg("🎰 Выпало " + d.prize + " ⭐!");
    else showMsg(d.msg);
  } catch(e) { showMsg("Ошибка, попробуй ещё раз"); }
  btn.disabled = false;
  loadProfile(); loadTop();
}

loadProfile(); loadInventory(); loadTop();
</script>
</body>
</html>
